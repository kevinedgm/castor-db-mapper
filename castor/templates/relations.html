<title>Mapa de tablas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a chart room. The relationship map fills the left; a ledger on the right
   explains whatever is selected, with the evidence (file:line) behind every line. */
:root {
  --bg: #f3f5f3; --surface: #ffffff; --fg: #18211d; --muted: #5d6a63; --line: #d5ddd8; --soft: #e8ede9;
  --accent: #0d7a59; --declared: #2459a6; --inferred: #b7791f; --dim: .12;
  --g1: #0d7a59; --g2: #2459a6; --g3: #9a3d8f; --g4: #b7791f; --g5: #c2462b; --g6: #3f7f8c; --g7: #6b5bb5; --g8: #6f7d2a; --g0: #8a958f;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --fg: #e2eae6; --muted: #92a29a; --line: #2a3530; --soft: #1d2622;
  --accent: #39c393; --declared: #74a9f0; --inferred: #e3a84a; --dim: .14;
  --g1: #39c393; --g2: #74a9f0; --g3: #d58bcb; --g4: #e3a84a; --g5: #ef8a6f; --g6: #6cc0cf; --g7: #a99bf0; --g8: #b6c463; --g0: #75827c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --fg: #e2eae6; --muted: #92a29a; --line: #2a3530; --soft: #1d2622;
  --accent: #39c393; --declared: #74a9f0; --inferred: #e3a84a; --dim: .14;
  --g1: #39c393; --g2: #74a9f0; --g3: #d58bcb; --g4: #e3a84a; --g5: #ef8a6f; --g6: #6cc0cf; --g7: #a99bf0; --g8: #b6c463; --g0: #75827c;
  color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h1 small { font: 400 12px var(--mono); color: var(--muted); margin-left: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; }
input[type=search] { font: 13px var(--mono); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 15rem; max-width: 100%; }
label.k { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.sw { width: 18px; height: 0; border-top: 2.5px solid; display: inline-block; }
.sw.d { border-color: var(--declared); } .sw.o { border-color: var(--accent); } .sw.i { border-color: var(--inferred); border-top-style: dashed; }
select { font: 12.5px var(--sans); padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
button { font: 500 12.5px var(--sans); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
#stage { position: relative; min-width: 0; overflow: hidden; touch-action: none; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg.drag { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
.edge { fill: none; stroke-linecap: round; }
.edge.CODE_OBSERVED { stroke: var(--accent); }
.edge.DECLARED { stroke: var(--declared); }
.edge.INFERRED { stroke: var(--inferred); stroke-dasharray: 5 4; }
.node circle { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.node text { font-family: var(--mono); fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: inherit; pointer-events: none; }
.node circle { stroke-width: 1.5px; }
.node.hide-label text { display: none; }
.faded { opacity: var(--dim); }
.sel circle { stroke: var(--fg); stroke-width: 2.5; }
aside { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding-block: 16px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); min-width: 0; }
aside h2 { font: 600 16px var(--mono); margin: 0 0 4px; word-break: break-all; }
aside h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.facts b { color: var(--fg); font-weight: 600; }
.rel { border-top: 1px solid var(--soft); padding: 10px 0; display: grid; gap: 4px; }
.rel-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.tlink { font: 500 13px var(--mono); color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; word-break: break-all; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.tlink:hover { text-decoration-color: var(--accent); }
.chip { font: 600 10.5px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid; }
.chip.CODE_OBSERVED { color: var(--accent); } .chip.DECLARED { color: var(--declared); } .chip.INFERRED { color: var(--inferred); border-style: dashed; }
.pair { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
.pair b { color: var(--fg); font-weight: 500; }
.n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
details { font-size: 12px; } summary { cursor: pointer; color: var(--muted); }
details ul { margin: 6px 0 0; padding-left: 16px; font: 11.5px var(--mono); color: var(--muted); }
details li { word-break: break-all; }
.cols { font: 12px var(--mono); color: var(--muted); line-height: 1.7; }
p.note { color: var(--muted); font-size: 12.5px; max-width: 60ch; }
.legend { display: grid; gap: 6px; font-size: 12.5px; }
.legend > div { display: flex; gap: 8px; align-items: baseline; }
.legend > div .sw { flex: none; transform: translateY(-3px); }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body { height: auto; } html { height: auto; }
  input[type=search] { width: 100%; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <h1>Mapa de tablas<small id="sub"></small></h1>
  <div class="tools">
    <input type="search" id="q" list="tlist" placeholder="Buscar tabla…" aria-label="Buscar tabla">
    <datalist id="tlist"></datalist>
    <label class="k"><input type="checkbox" id="kO" checked><span class="sw o"></span>Observada en código</label>
    <label class="k"><input type="checkbox" id="kD" checked><span class="sw d"></span>FK declarada</label>
    <label class="k"><input type="checkbox" id="kI" checked><span class="sw i"></span>Inferida por nombre</label>
    <label class="k" for="minN">Evidencia mínima
      <select id="minN"><option value="1">1 consulta</option><option value="2">2</option><option value="5">5</option><option value="20">20</option><option value="50">50</option></select>
    </label>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="svg" role="img" aria-label="Grafo de relaciones entre tablas"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="fit">Ajustar</button></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<script>
const DATA = __CASTOR_DATA__;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { CODE_OBSERVED: "observada", DECLARED: "FK declarada", INFERRED: "inferida" };
const NS = "http://www.w3.org/2000/svg";

// ---- model ---------------------------------------------------------------
const T = new Map(DATA.tables.map((t) => [t.name, t]));
const links = DATA.links.map((l, i) => ({ ...l, i }));
const deg = new Map();
links.forEach((l) => { deg.set(l.a, (deg.get(l.a) || 0) + 1); deg.set(l.b, (deg.get(l.b) || 0) + 1); });
const nodes = [...deg.keys()].sort().map((name) => ({ name, deg: deg.get(name), t: T.get(name) || { name, reads: 0, writes: 0, files: 0, cols: [] } }));
const byName = new Map(nodes.map((n) => [n.name, n]));
const isolated = DATA.tables.filter((t) => !deg.has(t.name));

// Color by table prefix (mz_, z_, oc_ …): the naming families of the schema.
const prefixOf = (n) => (n.includes("_") ? n.split("_")[0] + "_" : n);
const pc = new Map();
nodes.forEach((n) => pc.set(prefixOf(n.name), (pc.get(prefixOf(n.name)) || 0) + 1));
const topPrefixes = [...pc.entries()].filter(([, c]) => c > 1).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([p]) => p);
const colorOf = (n) => { const k = topPrefixes.indexOf(prefixOf(n)); return `var(--g${k < 0 ? 0 : k + 1})`; };

// ---- layout: Fruchterman–Reingold, seeded so the map is stable between runs --
(function layout() {
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const W = 1800, H = 1200, N = nodes.length, k = Math.sqrt((W * H) / Math.max(N, 1)) * 0.75;
  nodes.forEach((n) => { n.x = (rnd() - .5) * W; n.y = (rnd() - .5) * H; });
  const E = links.map((l) => [byName.get(l.a), byName.get(l.b), 1 + Math.log10(1 + l.n)]);
  let temp = W / 8;
  for (let it = 0; it < 420; it++) {
    nodes.forEach((n) => { n.dx = 0; n.dy = 0; });
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy + .01;
      if (d2 > 9 * k * k) continue; const f = (k * k) / d2; a.dx += dx * f; a.dy += dy * f; b.dx -= dx * f; b.dy -= dy * f;
    }
    E.forEach(([a, b, w]) => { const dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy) + .01, f = (d * w) / k;
      a.dx -= (dx / d) * f; a.dy -= (dy / d) * f; b.dx += (dx / d) * f; b.dy += (dy / d) * f; });
    nodes.forEach((n) => { n.dx -= n.x * 0.02; n.dy -= n.y * 0.03; // gravity keeps islands close
      const d = Math.sqrt(n.dx * n.dx + n.dy * n.dy) + .01, s = Math.min(d, temp) / d; n.x += n.dx * s; n.y += n.dy * s; });
    temp *= 0.985;
  }
})();

// ---- render --------------------------------------------------------------
const svg = $("#svg"), vp = $("#vp");
const el = (name, attrs, parent) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
links.forEach((l) => {
  const a = byName.get(l.a), b = byName.get(l.b);
  l.el = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: `edge ${l.kind}`, "stroke-width": (1 + Math.log10(1 + l.n) * 1.2).toFixed(2) }, $("#edges"));
  l.el.style.cursor = "pointer";
  const t = el("title", {}, l.el); t.textContent = `${l.a} ↔ ${l.b} · ${KIND[l.kind]} · ${l.n} consultas`;
  l.el.addEventListener("click", (e) => { e.stopPropagation(); showLink(l); });
});
nodes.forEach((n) => {
  n.r = 4 + 2.1 * Math.sqrt(n.deg);
  n.g = el("g", { class: "node", tabindex: 0, role: "button", "aria-label": `Tabla ${n.name}` }, $("#nodes"));
  el("circle", { cx: n.x, cy: n.y, r: n.r, fill: colorOf(n.name) }, n.g);
  const tx = el("text", { x: n.x + n.r + 3, y: n.y + 4 }, n.g); tx.textContent = n.name;
  n.g.addEventListener("click", (e) => { e.stopPropagation(); select(n.name); });
  n.g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.name); } });
});
$("#tlist").innerHTML = DATA.tables.map((t) => `<option value="${esc(t.name)}">`).join("");
$("#sub").textContent = `${DATA.root || ""} · ${DATA.tables.length} tablas · ${links.length} relaciones`;

// ---- view: pan / zoom ----------------------------------------------------
let view = { x: 0, y: 0, s: 1 };
const nodesG = document.getElementById("nodes");
const apply = () => {
  vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.s})`);
  // keep labels ~11px on screen whatever the zoom
  nodesG.style.fontSize = (11 / view.s).toFixed(2) + "px"; nodesG.style.strokeWidth = (3 / view.s).toFixed(2) + "px";
  labels();
};
function fit(list = nodes) {
  const r = svg.getBoundingClientRect(); if (!r.width || !list.length) return;
  const xs = list.map((n) => n.x), ys = list.map((n) => n.y);
  const x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 160, y0 = Math.min(...ys) - 40, y1 = Math.max(...ys) + 40;
  view.s = Math.min(r.width / (x1 - x0), r.height / (y1 - y0), 2.4);
  view.x = r.width / 2 - ((x0 + x1) / 2) * view.s; view.y = r.height / 2 - ((y0 + y1) / 2) * view.s; apply();
}
function zoomAt(f, cx, cy) { const s = Math.max(.15, Math.min(6, view.s * f)); view.x = cx - (cx - view.x) * (s / view.s); view.y = cy - (cy - view.y) * (s / view.s); view.s = s; apply(); }
svg.addEventListener("wheel", (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pts = new Map(); let pinch = 0, moved = false;
svg.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; svg.classList.add("drag"); });
svg.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId)) return; const p = pts.get(e.pointerId);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d0 = Math.hypot(a.x - b.x, a.y - b.y); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [c, d] = [...pts.values()]; const d1 = Math.hypot(c.x - d.x, c.y - d.y); const r = svg.getBoundingClientRect();
    if (d0 > 0) zoomAt(d1 / d0, (c.x + d.x) / 2 - r.left, (c.y + d.y) / 2 - r.top); moved = true; return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
  if (moved && !pts.has("cap")) { svg.setPointerCapture(e.pointerId); }
  view.x += dx; view.y += dy; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); apply();
});
const up = (e) => { pts.delete(e.pointerId); if (!pts.size) svg.classList.remove("drag"); };
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
svg.addEventListener("click", () => { if (!moved) select(null); });
$("#zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
$("#zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
$("#fit").onclick = () => (selected ? fit(neighborhood(selected)) : fit());

// ---- filters & selection -------------------------------------------------
let selected = null;
const visible = (l) => ({ CODE_OBSERVED: $("#kO").checked, DECLARED: $("#kD").checked, INFERRED: $("#kI").checked }[l.kind]) && (l.kind === "INFERRED" || l.n >= +$("#minN").value);
const neighborhood = (name) => [byName.get(name), ...links.filter((l) => visible(l) && (l.a === name || l.b === name)).map((l) => byName.get(l.a === name ? l.b : l.a))];
function labels() {
  const near = selected ? new Set(neighborhood(selected).map((n) => n.name)) : null;
  nodes.forEach((n) => n.g.classList.toggle("hide-label", !(near ? near.has(n.name) : n.deg >= 6 || view.s > 1.3)));
}
function paint() {
  const near = selected ? new Set(neighborhood(selected).map((n) => n.name)) : null;
  const live = new Set();
  links.forEach((l) => { const v = visible(l); l.el.style.display = v ? "" : "none"; if (v) { live.add(l.a); live.add(l.b); }
    l.el.classList.toggle("faded", !!near && !(l.a === selected || l.b === selected)); });
  nodes.forEach((n) => { n.g.classList.toggle("faded", near ? !near.has(n.name) : !live.has(n.name)); n.g.classList.toggle("sel", n.name === selected); });
  labels();
}
["kO", "kD", "kI", "minN"].forEach((id) => $("#" + id).addEventListener("change", () => { paint(); selected ? showTable(selected) : showSummary(); }));
$("#q").addEventListener("change", (e) => { const v = e.target.value.trim(); if (T.has(v)) select(v, true); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { const v = e.target.value.trim().toLowerCase(); const hit = DATA.tables.find((t) => t.name === v) || DATA.tables.find((t) => t.name.includes(v)); if (hit) select(hit.name, true); } });
function select(name, focus = false) {
  selected = name && byName.has(name) ? name : null; paint();
  if (name && !byName.has(name) && T.has(name)) { showTable(name); return; }
  selected ? showTable(selected) : showSummary();
  if (selected && focus) fit(neighborhood(selected));
}

// ---- panel ---------------------------------------------------------------
const panel = $("#panel");
const tbtn = (n) => `<button class="tlink" data-t="${esc(n)}">${esc(n)}</button>`;
panel.addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) select(b.dataset.t, true); const l = e.target.closest("[data-l]"); if (l) showLink(links[+l.dataset.l]); });
function relRow(l, from) {
  const other = from ? (l.a === from ? l.b : l.a) : null;
  const pairs = l.pairs.slice(0, 4).map((p) => { const [x, y] = from && l.a !== from ? [`${l.b}.${p.b}`, `${l.a}.${p.a}`] : [`${l.a}.${p.a}`, `${l.b}.${p.b}`];
    return `<div class="pair"><b>${esc(x)}</b> = <b>${esc(y)}</b>${p.n ? ` · ${p.n}` : ""}</div>`; }).join("");
  const ev = l.ev.length ? `<details><summary>Ver evidencia (${l.files} archivo${l.files === 1 ? "" : "s"})</summary><ul>${l.ev.map((e) => `<li>${esc(e.file)}:${e.line}</li>`).join("")}</ul></details>` : `<div class="n">Sin consulta que la use; solo coincidencia de nombre.</div>`;
  return `<div class="rel"><div class="rel-head">${other ? tbtn(other) : `<button class="tlink" data-l="${l.i}">${esc(l.a)} ↔ ${esc(l.b)}</button>`}<span class="chip ${l.kind}">${KIND[l.kind]}</span></div>${pairs}<div class="n">${l.n} consulta${l.n === 1 ? "" : "s"}</div>${ev}</div>`;
}
function showSummary() {
  const vis = links.filter(visible), noFk = links.filter((l) => l.kind !== "DECLARED").length;
  panel.innerHTML = `<h2>${esc(DATA.root || "Base de datos")}</h2>
    <div class="facts"><span><b>${DATA.tables.length}</b> tablas</span><span><b>${links.length}</b> relaciones</span><span><b>${noFk}</b> sin FK declarada</span><span><b>${isolated.length}</b> tablas sin relación detectada</span></div>
    <p class="note">Cada línea une dos tablas que el código compara columna con columna (<code>a.x = b.y</code>), aunque la base no tenga llave foránea. El grosor indica en cuántas consultas aparece. Toca una tabla para ver con quién se relaciona y en qué archivo.</p>
    <h3>Leyenda</h3><div class="legend"><div><span class="sw o"></span><span>Observada en código: un JOIN o WHERE las compara</span></div><div><span class="sw d"></span><span>FK declarada en un archivo .sql del repo</span></div><div><span class="sw i"></span><span>Inferida solo por el nombre (<code>_id</code>), sin consulta que la use</span></div>
    <div><span>Color del punto = familia de nombre: ${topPrefixes.map((p, i) => `<b style="color:var(--g${i + 1})">${esc(p)}</b>`).join(" ")}; gris = otras.</span></div></div>
    <h3>Relaciones más usadas</h3>${vis.slice(0, 12).map((l) => relRow(l, null)).join("")}
    ${isolated.length ? `<h3>Tablas sin relación detectada</h3><div class="cols">${isolated.map((t) => esc(t.name)).join(" · ")}</div>` : ""}
    <p class="note">Generado ${DATA.generated_at ? esc(DATA.generated_at.slice(0, 10)) : ""} por análisis estático. Una relación observada no prueba integridad referencial en la base real.</p>`;
}
function showTable(name) {
  const t = T.get(name) || { name, reads: 0, writes: 0, files: 0, cols: [] };
  const rels = links.filter((l) => visible(l) && (l.a === name || l.b === name));
  const hidden = links.filter((l) => !visible(l) && (l.a === name || l.b === name)).length;
  panel.innerHTML = `<h2>${esc(name)}</h2>
    <div class="facts"><span><b>${rels.length}</b> tablas relacionadas</span><span>leída en <b>${t.reads}</b> consultas</span><span>escrita en <b>${t.writes}</b></span><span><b>${t.files}</b> archivos</span></div>
    <h3>Se relaciona con</h3>${rels.length ? rels.map((l) => relRow(l, name)).join("") : `<p class="note">Sin relaciones con los filtros actuales.</p>`}
    ${hidden ? `<p class="note">${hidden} relación${hidden === 1 ? "" : "es"} más oculta${hidden === 1 ? "" : "s"} por los filtros.</p>` : ""}
    ${t.cols.length ? `<h3>Columnas vistas (${t.cols.length})</h3><div class="cols">${t.cols.map(esc).join(" · ")}</div>` : ""}
    <p class="note"><button class="tlink" data-t="">← Volver al resumen</button></p>`;
}
function showLink(l) {
  select(null); l.el.classList.remove("faded");
  panel.innerHTML = `<h2>${esc(l.a)} ↔ ${esc(l.b)}</h2><div class="facts"><span class="chip ${l.kind}">${KIND[l.kind]}</span><span><b>${l.n}</b> consultas</span><span><b>${l.files}</b> archivos</span></div>
    <h3>Columnas que las unen</h3>${l.pairs.map((p) => `<div class="pair"><b>${esc(l.a)}.${esc(p.a)}</b> = <b>${esc(l.b)}.${esc(p.b)}</b> · ${p.kinds.map((k) => KIND[k]).join(", ")}${p.n ? ` · ${p.n} consultas` : ""}</div>`).join("")}
    <h3>Evidencia</h3>${l.ev.length ? `<ul class="cols">${l.ev.map((e) => `<li>${esc(e.file)}:${e.line}</li>`).join("")}</ul>` : `<p class="note">Solo coincidencia de nombre.</p>`}
    <h3>Tablas</h3><p>${tbtn(l.a)} · ${tbtn(l.b)}</p>`;
}

paint(); showSummary();
requestAnimationFrame(() => fit());
addEventListener("resize", () => (selected ? fit(neighborhood(selected)) : fit()));
</script>
